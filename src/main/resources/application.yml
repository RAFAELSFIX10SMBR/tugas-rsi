server:
  port: 8080

spring:
  application:
    name: ordering-system
  datasource:
    url: jdbc:mariadb://localhost:3306/ordering_db
    username: root
    password: ""
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

